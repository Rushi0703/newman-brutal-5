name: Newman Brutal Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 8 * * 1-5'

  workflow_dispatch:

jobs:
  newman-run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev.postman_environment.json
          - staging.postman_environment.json

        include:
          - collection: auth-collection
            datafile: auth-scenarios.csv

          - collection: data-collection
            datafile: product-scenarios.csv

    name: ${{ matrix.collection }}-${{ matrix.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Create Reports Folder
        run: mkdir -p reports

      - name: Run Newman Collection
        run: |
          newman run ./collections/${{ matrix.collection }}.json \
          -e ./environments/${{ matrix.environment }} \
          -d ./data/${{ matrix.datafile }} \
          --reporters cli,htmlextra,json \
          --reporter-htmlextra-export ./reports/${{ matrix.collection }}-${{ matrix.environment }}.html \
          --reporter-json-export ./reports/${{ matrix.collection }}-${{ matrix.environment }}.json \
          --delay-request 300 \
          --timeout-request 15000

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.collection }}-${{ matrix.environment }}-${{ github.run_number }}
          path: reports/

      - name: Add Summary
        if: always()
        run: |
          echo "## Newman Result" >> $GITHUB_STEP_SUMMARY
          echo "- Collection: ${{ matrix.collection }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

  result-matrix:
    needs: newman-run
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Matrix Summary
        run: |
          echo "## Result Matrix" >> $GITHUB_STEP_SUMMARY
          echo "| Collection | Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Auth Collection | Dev/Staging | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Collection | Dev/Staging | Completed |" >> $GITHUB_STEP_SUMMARY